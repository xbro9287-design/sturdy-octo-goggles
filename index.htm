<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X MOD - Video Platform</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0b0b; color: #fff; }

        @keyframes glow {
            0% { text-shadow: 0 0 5px #ff9900, 0 0 10px #ff9900; }
            50% { text-shadow: 0 0 20px #ff6600, 0 0 30px #ff6600; }
            100% { text-shadow: 0 0 5px #ff9900, 0 0 10px #ff9900; }
        }

        header { background: #121212; display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; border-bottom: 2px solid #ff9900; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 28px; font-weight: 900; letter-spacing: 1px; color: #fff; cursor: pointer; }
        .logo span { background: #ff9900; color: #000; padding: 2px 8px; border-radius: 4px; animation: glow 2s infinite; margin-left: 5px; }

        .container { padding: 30px; max-width: 1400px; margin: auto; }
        .page { display: none; }
        .active-page { display: block; }

        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .video-card { background: #181818; border-radius: 8px; overflow: hidden; transition: transform 0.3s; cursor: pointer; border: 1px solid #222; }
        .video-card:hover { transform: translateY(-5px); border-color: #ff9900; }
        .thumbnail-container { width: 100%; height: 170px; background: #000; position: relative; }
        .thumbnail-container video { width: 100%; height: 100%; object-fit: cover; }
        .video-info { padding: 12px; }
        .video-title { font-size: 15px; font-weight: bold; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .video-meta { font-size: 12px; color: #aaa; display: flex; justify-content: space-between; }

        .watch-container { max-width: 900px; margin: auto; }
        .main-player { width: 100%; height: 480px; background: #000; border-radius: 8px; border: 1px solid #333; }
        .video-details { margin-top: 15px; padding-bottom: 15px; border-bottom: 1px solid #333; }
        .view-count { color: #ff9900; font-size: 14px; margin-top: 5px; font-weight: bold; }

        /* Comments Section */
        .comments-section { margin-top: 25px; }
        .comments-section h3 { margin-bottom: 15px; color: #ff9900; }
        .comment-input-box { display: flex; gap: 10px; margin-bottom: 20px; }
        .comment-input-box input { flex: 1; padding: 12px; background: #181818; border: 1px solid #333; color: #fff; border-radius: 5px; outline: none; }
        .comment-input-box input:focus { border-color: #ff9900; }
        .comment-input-box button { padding: 12px 20px; background: #ff9900; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; color: #000; }
        .comments-list { display: flex; flex-direction: column; gap: 12px; }
        .comment-item { background: #141414; padding: 12px; border-radius: 6px; border-left: 3px solid #ff9900; font-size: 14px; line-height: 1.4; }
        .comment-user { font-weight: bold; color: #aaa; margin-bottom: 4px; font-size: 12px; }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="showPage('homePage')">X<span>MOD</span></div>
    </header>

    <!-- HOME PAGE -->
    <div id="homePage" class="container page active-page">
        <h2 style="margin-bottom: 20px; border-left: 4px solid #ff9900; padding-left: 10px;">Videos</h2>
        <div class="video-grid" id="videoGrid"></div>
    </div>

    <!-- WATCH PAGE -->
    <div id="watchPage" class="container page">
        <div class="watch-container">
            <button onclick="showPage('homePage')" style="background:none; border:none; color:#ff9900; cursor:pointer; margin-bottom:15px; font-size:16px; font-weight:bold;">← Back to Home</button>
            <video id="videoPlayer" class="main-player" controls autoplay></video>
            <div class="video-details">
                <h1 id="watchTitle" style="font-size: 22px;"></h1>
                <div id="watchViews" class="view-count">0 Views</div>
            </div>

            <!-- COMMENTS SECTION -->
            <div class="comments-section">
                <h3>Comments</h3>
                <div class="comment-input-box">
                    <input type="text" id="commentInput" placeholder="Write a comment...">
                    <button onclick="postComment()">Post</button>
                </div>
                <div class="comments-list" id="commentsList"></div>
            </div>
        </div>
    </div>

    <script>
        // ========================================================
        // 🎬 මෙතනට ඔයාගේ වීඩියෝවල ID, TITLE සහ LINK එකතු කරන්න!
        // ========================================================
        const myVideos = [
            {
                id: "v1",
                title: "My First Official Video",
                url: "https://streamable.com/jzov1r"
            },
            {
                id: "v2",
                title: "My Second Video",
                url: "https://res.cloudinary.com/Iujkktcz/video/upload/v1710000000/sample2.mp4"
            }
        ];
        // ========================================================

        let currentVideoId = null;

        function loadVideos() {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '';

            myVideos.forEach(v => {
                const views = localStorage.getItem('views_' + v.id) || 0;
                const card = document.createElement('div');
                card.className = 'video-card';
                card.onclick = () => openWatchPage(v);
                card.innerHTML = `
                    <div class="thumbnail-container">
                        <video src="${v.url}#t=0.5" preload="metadata"></video>
                    </div>
                    <div class="video-info">
                        <div class="video-title">${v.title}</div>
                        <div class="video-meta">
                            <span>X MOD Official</span>
                            <span>${views} Views</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openWatchPage(video) {
            currentVideoId = video.id;
            document.getElementById('videoPlayer').src = video.url;
            document.getElementById('watchTitle').innerText = video.title;

            // Increase View Count on Click
            let views = parseInt(localStorage.getItem('views_' + video.id) || 0) + 1;
            localStorage.setItem('views_' + video.id, views);
            document.getElementById('watchViews').innerText = views + " Views";

            // Load Comments for this video
            loadComments(video.id);

            showPage('watchPage');
        }

        function loadComments(videoId) {
            const commentsList = document.getElementById('commentsList');
            commentsList.innerHTML = '';
            const comments = JSON.parse(localStorage.getItem('comments_' + videoId)) || [];

            if (comments.length === 0) {
                commentsList.innerHTML = '<p style="color: #666; font-size:14px;">තවම Comment එකක් නැත. පළමු Comment එක දාන්න!</p>';
                return;
            }

            comments.forEach(c => {
                const item = document.createElement('div');
                item.className = 'comment-item';
                item.innerHTML = `
                    <div class="comment-user">Viewer • ${c.time}</div>
                    <div>${c.text}</div>
                `;
                commentsList.appendChild(item);
            });
        }

        function postComment() {
            const input = document.getElementById('commentInput');
            const text = input.value.trim();
            if (!text || !currentVideoId) return;

            let comments = JSON.parse(localStorage.getItem('comments_' + currentVideoId)) || [];
            const newComment = {
                text: text,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            comments.unshift(newComment);
            localStorage.setItem('comments_' + currentVideoId, JSON.stringify(comments));

            input.value = '';
            loadComments(currentVideoId);
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById(pageId).classList.add('active-page');
            window.scrollTo(0, 0);
        }

        loadVideos();
    </script>
</body>
</html>
