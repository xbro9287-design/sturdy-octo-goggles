<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X MOD - Video Save Platform</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0b0b; color: #fff; overflow-x: hidden; min-height: 100vh; padding: 40px 20px; }

        /* Animation: Video Card Drop In Effect */
        @keyframes dropIn {
            0% {
                opacity: 0;
                transform: translateY(-80px) scale(0.8) rotate(-3deg);
            }
            60% {
                opacity: 1;
                transform: translateY(15px) scale(1.02) rotate(1deg);
            }
            100% {
                transform: translateY(0) scale(1) rotate(0deg);
            }
        }

        /* Video Grid - Home Page Centered Layout */
        .container { max-width: 1200px; margin: auto; }
        .video-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 30px; 
            padding: 20px 0;
        }

        .video-card { 
            background: #181818; 
            border-radius: 12px; 
            overflow: hidden; 
            border: 2px solid #ff9900; 
            box-shadow: 0 8px 25px rgba(255, 153, 0, 0.25);
            /* Drop Animation Applied Here */
            animation: dropIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transition: transform 0.3s;
        }
        .video-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(255, 153, 0, 0.4);
        }

        .thumbnail-container { width: 100%; height: 200px; background: #000; position: relative; }
        .thumbnail-container video { width: 100%; height: 100%; object-fit: cover; }
        .video-info { padding: 15px; background: #121212; }
        .video-title { font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .save-status { font-size: 13px; color: #ff9900; font-weight: 600; display: flex; align-items: center; gap: 6px; }

        /* Floating Plus (+) Button */
        .fab-btn { 
            position: fixed; 
            bottom: 40px; 
            right: 40px; 
            background: linear-gradient(45deg, #ff9900, #ff5500); 
            color: #fff; 
            width: 70px; 
            height: 70px; 
            border-radius: 50%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 40px; 
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 0 6px 25px rgba(255, 153, 0, 0.6); 
            transition: transform 0.2s; 
            z-index: 99; 
        }
        .fab-btn:hover { transform: scale(1.15); }

        /* Upload Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #1f1f1f; padding: 30px; border-radius: 12px; width: 90%; max-width: 450px; border: 2px solid #ff9900; position: relative; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; color: #aaa; }
        .modal h2 { margin-bottom: 20px; color: #ff9900; text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; }
        .form-group input { width: 100%; padding: 12px; background: #2b2b2b; border: 1px solid #444; color: white; border-radius: 6px; outline: none; }
        .submit-btn { width: 100%; padding: 12px; background: #ff9900; border: none; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 6px; margin-top: 10px; color: #000; }
        
        .empty-msg { text-align: center; color: #555; margin-top: 100px; font-size: 18px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Home Page Video List (Only Video Cards Will Be Shown Here) -->
        <div class="video-grid" id="videoGrid"></div>
    </div>

    <!-- Floating Add Button -->
    <div class="fab-btn" onclick="openModal()">+</div>

    <!-- Upload Modal -->
    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2>Save New Video</h2>
            <div class="form-group">
                <label>Video Title</label>
                <input type="text" id="videoTitleInput" placeholder="Enter title...">
            </div>
            <div class="form-group">
                <label>Select Video File</label>
                <input type="file" id="videoFileInput" accept="video/*">
            </div>
            <button class="submit-btn" id="uploadBtn" onclick="uploadVideo()">Save to Home</button>
        </div>
    </div>

    <script>
        let db;
        let videos = [];

        // IndexedDB Initialize
        const request = indexedDB.open("XModDropVideoDB", 1);

        request.onupgradeneeded = function(e) {
            db = e.target.result;
            if (!db.objectStoreNames.contains("videos")) {
                db.createObjectStore("videos", { keyPath: "id" });
            }
        };

        request.onsuccess = function(e) {
            db = e.target.result;
            loadStoredVideos();
        };

        function loadStoredVideos() {
            const tx = db.transaction("videos", "readonly");
            const store = tx.objectStore("videos");
            const getAll = store.getAll();

            getAll.onsuccess = function() {
                videos = getAll.result || [];
                renderVideos();
            };
        }

        function renderVideos() {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '';

            if (videos.length === 0) {
                grid.innerHTML = '<div class="empty-msg">තවම වීඩියෝ නැත. එකතු කිරීමට + ලකුණ ක්ලික් කරන්න.</div>';
                return;
            }

            videos.forEach((v, index) => {
                const videoUrl = URL.createObjectURL(v.fileBlob);
                const card = document.createElement('div');
                card.className = 'video-card';
                
                // Animation delay for existing videos on load
                card.style.animationDelay = `${index * 0.1}s`;

                card.innerHTML = `
                    <div class="thumbnail-container">
                        <video src="${videoUrl}#t=0.5" controls preload="metadata"></video>
                    </div>
                    <div class="video-info">
                        <div class="video-title">${v.title}</div>
                        <div class="save-status">
                            <span>✔</span> Saved in Storage
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openModal() { document.getElementById('uploadModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('uploadModal').style.display = 'none'; }

        function uploadVideo() {
            const titleInput = document.getElementById('videoTitleInput').value.trim();
            const fileInput = document.getElementById('videoFileInput').files[0];

            if (!titleInput || !fileInput) {
                alert('කරුණාකර මාතෘකාවක් සහ Video File එකක් Select කරන්න!');
                return;
            }

            const btn = document.getElementById('uploadBtn');
            btn.innerText = "Saving Video...";
            btn.disabled = true;

            const newVideo = {
                id: Date.now().toString(),
                title: titleInput,
                fileBlob: fileInput
            };

            const tx = db.transaction("videos", "readwrite");
            const store = tx.objectStore("videos");
            store.add(newVideo);

            tx.oncomplete = function() {
                btn.innerText = "Save to Home";
                btn.disabled = false;
                
                // Add to top of array for immediate render with animation
                videos.unshift(newVideo);
                renderVideos();
                closeModal();

                document.getElementById('videoTitleInput').value = '';
                document.getElementById('videoFileInput').value = '';
            };
        }
    </script>
</body>
</html>
