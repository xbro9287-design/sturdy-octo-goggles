<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X MOD - Video Platform</title>
    <style>
        /* === GLOBAL STYLES & ANIMATIONS === */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0b0b; color: #fff; overflow-x: hidden; }

        /* Glowing Animated Logo */
        @keyframes glow {
            0% { text-shadow: 0 0 5px #ff9900, 0 0 10px #ff9900; }
            50% { text-shadow: 0 0 20px #ff6600, 0 0 30px #ff6600; }
            100% { text-shadow: 0 0 5px #ff9900, 0 0 10px #ff9900; }
        }

        /* Navbar Design */
        header { background: #121212; display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; border-bottom: 2px solid #ff9900; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 28px; font-weight: 900; letter-spacing: 1px; color: #fff; cursor: pointer; }
        .logo span { background: #ff9900; color: #000; padding: 2px 8px; border-radius: 4px; animation: glow 2s infinite; margin-left: 5px; }
        
        .search-bar { display: flex; width: 40%; }
        .search-bar input { width: 100%; padding: 10px; background: #222; border: 1px solid #333; color: #fff; border-radius: 4px 0 0 4px; outline: none; }
        .search-bar button { padding: 10px 20px; background: #ff9900; border: none; font-weight: bold; cursor: pointer; border-radius: 0 4px 4px 0; }

        /* Page Layouts */
        .container { padding: 30px; max-width: 1400px; margin: auto; }
        .page { display: none; }
        .active-page { display: block; }

        /* Video Grid Layout */
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .video-card { background: #181818; border-radius: 8px; overflow: hidden; transition: transform 0.3s, box-shadow 0.3s; cursor: pointer; border: 1px solid #222; }
        .video-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(255, 153, 0, 0.3); border-color: #ff9900; }
        .thumbnail-container { width: 100%; height: 170px; background: #000; position: relative; }
        .thumbnail-container video { width: 100%; height: 100%; object-fit: cover; }
        .video-info { padding: 12px; }
        .video-title { font-size: 15px; font-weight: bold; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .video-meta { font-size: 12px; color: #aaa; }

        /* Floating Plus (+) Button */
        .fab-btn { position: fixed; bottom: 30px; right: 30px; background: linear-gradient(45deg, #ff9900, #ff5500); color: #fff; width: 65px; height: 65px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 36px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 20px rgba(255, 153, 0, 0.5); transition: transform 0.2s; z-index: 99; }
        .fab-btn:hover { transform: scale(1.1); }

        /* Upload Modal (Pop-up) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #1f1f1f; padding: 30px; border-radius: 10px; width: 90%; max-width: 500px; border: 1px solid #ff9900; position: relative; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; color: #aaa; }
        .modal h2 { margin-bottom: 20px; color: #ff9900; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; }
        .form-group input { width: 100%; padding: 10px; background: #2b2b2b; border: 1px solid #444; color: white; border-radius: 4px; }
        .submit-btn { width: 100%; padding: 12px; background: #ff9900; border: none; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 10px; }

        /* Single Watch Page Styles */
        .watch-container { max-width: 1000px; margin: auto; }
        .main-player { width: 100%; height: 500px; background: #000; border-radius: 8px; outline: none; border: 1px solid #333; }
        .watch-title { font-size: 22px; margin: 15px 0 10px 0; color: #fff; }
        .actions-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 20px; }
        .action-btns button { background: #222; border: 1px solid #444; color: white; padding: 8px 15px; margin-left: 8px; border-radius: 4px; cursor: pointer; }
        .action-btns button:hover { background: #ff9900; color: black; }
        
        /* Comments Section */
        .comments-section { margin-top: 20px; }
        .comment-input { display: flex; gap: 10px; margin-bottom: 20px; }
        .comment-input input { flex: 1; padding: 10px; background: #222; border: 1px solid #333; color: white; border-radius: 4px; }
        .comment-input button { padding: 10px 20px; background: #ff9900; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .comment-list .comment-item { background: #181818; padding: 10px 15px; border-radius: 4px; margin-bottom: 10px; border-left: 3px solid #ff9900; }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="logo" onclick="showPage('homePage')">X<span>MOD</span></div>
        <div class="search-bar">
            <input type="text" placeholder="Search videos...">
            <button>Search</button>
        </div>
    </header>

    <!-- MAIN HOME PAGE -->
    <div id="homePage" class="container page active-page">
        <h2 style="margin-bottom: 20px; border-left: 4px solid #ff9900; padding-left: 10px;">Trending Videos</h2>
        <div class="video-grid" id="videoGrid">
            <!-- Videos will be populated here dynamically -->
        </div>
    </div>

    <!-- SINGLE VIDEO WATCH PAGE -->
    <div id="watchPage" class="container page">
        <div class="watch-container">
            <button onclick="showPage('homePage')" style="background:none; border:none; color:#ff9900; cursor:pointer; margin-bottom:10px;">← Back to Home</button>
            <video id="videoPlayer" class="main-player" controls autoplay></video>
            <h1 id="watchTitle" class="watch-title">Video Title</h1>
            
            <div class="actions-bar">
                <span id="watchViews" style="color: #aaa;">0 Views</span>
                <div class="action-btns">
                    <button onclick="likeVideo()">👍 <span id="likeCount">0</span></button>
                    <button>👎 Dislike</button>
                    <button onclick="alert('Download started...')">⬇ Download</button>
                </div>
            </div>

            <!-- Comments -->
            <div class="comments-section">
                <h3>Comments</h3>
                <div class="comment-input" style="margin-top: 10px;">
                    <input type="text" id="commentText" placeholder="Add a public comment...">
                    <button onclick="addComment()">Comment</button>
                </div>
                <div class="comment-list" id="commentList">
                    <!-- Comments added here -->
                </div>
            </div>
        </div>
    </div>

    <!-- FLOATING PLUS BUTTON -->
    <div class="fab-btn" onclick="openModal()">+</div>

    <!-- UPLOAD MODAL (POPUP) -->
    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2>Upload Video to X MOD</h2>
            <div class="form-group">
                <label>Video Title</label>
                <input type="text" id="videoTitleInput" placeholder="Enter video title...">
            </div>
            <div class="form-group">
                <label>Select Video File</label>
                <input type="file" id="videoFileInput" accept="video/*">
            </div>
            <button class="submit-btn" onclick="uploadVideo()">Publish Video</button>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Sample Initial Data Database
        let videos = [
            {
                id: '1',
                title: 'X Mod Official Intro Demo Video',
                url: 'https://www.w3schools.com/html/mov_bbb.mp4',
                views: 1240,
                likes: 85,
                comments: ['Awesome platform!', 'Love the design.']
            }
        ];

        let currentVideoId = null;

        // Page Router Function
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById(pageId).classList.add('active-page');
            window.scrollTo(0, 0);
        }

        // Render Video Grid on Home Page
        function renderVideos() {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '';

            videos.forEach(v => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.onclick = () => openWatchPage(v.id);
                card.innerHTML = `
                    <div class="thumbnail-container">
                        <video src="${v.url}#t=0.5" preload="metadata"></video>
                    </div>
                    <div class="video-info">
                        <div class="video-title">${v.title}</div>
                        <div class="video-meta">${v.views} views • Just now</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Open Single Video Watch Page
        function openWatchPage(id) {
            const video = videos.find(v => v.id === id);
            if (!video) return;

            currentVideoId = id;
            video.views += 1; // Increase Views

            document.getElementById('videoPlayer').src = video.url;
            document.getElementById('watchTitle').innerText = video.title;
            document.getElementById('watchViews').innerText = `${video.views} Views`;
            document.getElementById('likeCount').innerText = video.likes;

            // Render Comments
            renderComments(video.comments);

            showPage('watchPage');
            renderVideos(); // Refresh home views
        }

        // Like Functionality
        function likeVideo() {
            const video = videos.find(v => v.id === currentVideoId);
            if (video) {
                video.likes += 1;
                document.getElementById('likeCount').innerText = video.likes;
            }
        }

        // Comment Functionality
        function addComment() {
            const input = document.getElementById('commentText');
            if (!input.value.trim()) return;

            const video = videos.find(v => v.id === currentVideoId);
            if (video) {
                video.comments.push(input.value);
                renderComments(video.comments);
                input.value = '';
            }
        }

        function renderComments(commentsArray) {
            const list = document.getElementById('commentList');
            list.innerHTML = commentsArray.map(c => `<div class="comment-item">${c}</div>`).join('');
        }

        // Modal Controls
        function openModal() { document.getElementById('uploadModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('uploadModal').style.display = 'none'; }

        // Handle Video Upload
        function uploadVideo() {
            const titleInput = document.getElementById('videoTitleInput').value;
            const fileInput = document.getElementById('videoFileInput').files[0];

            if (!titleInput || !fileInput) {
                alert('Please provide a title and select a video file.');
                return;
            }

            // Create Local Blob URL for uploaded video
            const videoURL = URL.createObjectURL(fileInput);

            const newVideo = {
                id: Date.now().toString(),
                title: titleInput,
                url: videoURL,
                views: 0,
                likes: 0,
                comments: []
            };

            videos.unshift(newVideo); // Add to top of list
            renderVideos();
            closeModal();

            // Clear Inputs
            document.getElementById('videoTitleInput').value = '';
            document.getElementById('videoFileInput').value = '';

            alert('Video uploaded successfully!');
        }

        // Initial Initialization
        renderVideos();
    </script>
</body>
</html>
