<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XMOD Aesthetic Feed</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg: #09090b;
      --card-bg: #121215;
      --accent: #ff0055;
      --text: #ffffff;
      --subtext: #a1a1aa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 50px; }
    
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 15px 5%; background: rgba(18, 18, 21, 0.8);
      backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid #27272a;
    }
    .logo { font-size: 24px; font-weight: bold; color: var(--accent); }
    .btn-auth {
      background: var(--accent); color: white; border: none;
      padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer;
    }
    .user-avatar { width: 35px; height: 35px; border-radius: 50%; border: 2px solid var(--accent); }

    .feed-container { max-width: 600px; margin: 20px auto; padding: 0 15px; }
    
    .card {
      background: var(--card-bg); border-radius: 12px; margin-bottom: 25px;
      overflow: hidden; border: 1px solid #27272a;
    }
    .card-header { padding: 12px 15px; display: flex; align-items: center; gap: 10px; }
    .card-title { font-weight: bold; margin-bottom: 2px; }
    .card-author { font-size: 12px; color: var(--subtext); }
    
    .media-box { width: 100%; background: #000; display: flex; justify-content: center; }
    .media-box img, .media-box video { width: 100%; max-height: 500px; object-fit: contain; }

    .card-footer { padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; }
    .like-btn { background: none; border: none; color: var(--accent); font-size: 18px; cursor: pointer; }

    /* Modal / Upload Form */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 200;
    }
    .modal-content {
      background: var(--card-bg); padding: 25px; border-radius: 12px;
      width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 12px;
    }
    .modal-content input, .modal-content select {
      background: #1e1e24; border: 1px solid #3f3f46; color: white;
      padding: 10px; border-radius: 6px;
    }
    .modal-content button {
      background: var(--accent); color: white; border: none; padding: 10px;
      border-radius: 6px; font-weight: bold; cursor: pointer;
    }
    .fab {
      position: fixed; bottom: 20px; right: 20px; background: var(--accent);
      width: 50px; height: 50px; border-radius: 50%; font-size: 24px;
      display: flex; justify-content: center; align-items: center; cursor: pointer;
      box-shadow: 0 4px 10px rgba(255,0,85,0.4);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">XMOD</div>
    <div id="authArea">
      <button class="btn-auth" onclick="openAuthModal()">Sign In</button>
    </div>
  </header>

  <div class="feed-container" id="feed">
    <p style="text-align: center; color: var(--subtext);">Loading posts...</p>
  </div>

  <div class="fab" onclick="openUploadModal()">+</div>

  <!-- Upload Modal -->
  <div class="modal" id="uploadModal">
    <div class="modal-content">
      <h3>New Post</h3>
      <input type="text" id="postTitle" placeholder="Title">
      <select id="postType">
        <option value="photo">Photo (Image URL)</option>
        <option value="video">Video (MP4 URL)</option>
      </select>
      <input type="text" id="postUrl" placeholder="Direct Media Link (URL)">
      <button onclick="submitPost()">Publish Post</button>
      <button style="background:#3f3f46" onclick="closeUploadModal()">Cancel</button>
    </div>
  </div>

  <!-- Auth Modal -->
  <div class="modal" id="authModal">
    <div class="modal-content" style="text-align: center;">
      <h3>Sign In to XMOD</h3>
      <p style="font-size: 13px; color: var(--subtext); margin-bottom: 15px;">Choose your method</p>
      
      <div id="g_id_onload"
        data-client_id="594971861176-0n783if040hhis298aaavla6tmdg97tg.apps.googleusercontent.com"
        data-callback="handleCredentialResponse">
      </div>
      <div class="g_id_signin" data-type="standard"></div>
      
      <button style="background:#3f3f46; margin-top: 15px;" onclick="closeAuthModal()">Close</button>
    </div>
  </div>

  <script>
    // 1. Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyC7Yx0UkpU_XNE_wM3aXzwopaaJ2YYbSJU",
      authDomain: "xsri-e468b.firebaseapp.com",
      projectId: "xsri-e468b",
      storageBucket: "xsri-e468b.firebasestorage.app",
      messagingSenderId: "857981291104",
      appId: "1:857981291104:web:2da412c4546b06a6ff9105",
      measurementId: "G-TY50B7M6P7"
    };

    // Initialize Firebase & Firestore
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentUser = JSON.parse(localStorage.getItem('xmod_logged_user')) || null;

    window.onload = function() {
      checkLoginState();
      listenToGlobalFeed();
    };

    // 2. Real-time Firestore Feed Updates
    function listenToGlobalFeed() {
      db.collection("posts").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
        const feed = document.getElementById('feed');
        if (snapshot.empty) {
          feed.innerHTML = '<p style="text-align: center; color: var(--subtext);">No posts yet. Be the first to share!</p>';
          return;
        }

        feed.innerHTML = '';
        snapshot.forEach((doc) => {
          const item = doc.data();
          const id = doc.id;

          let mediaHtml = item.type === 'video' 
            ? `<video src="${item.url}" controls></video>`
            : `<img src="${item.url}" alt="Post">`;

          feed.innerHTML += `
            <div class="card">
              <div class="card-header">
                <div>
                  <div class="card-title">${item.title}</div>
                  <div class="card-author">By ${item.author}</div>
                </div>
              </div>
              <div class="media-box">${mediaHtml}</div>
              <div class="card-footer">
                <button class="like-btn" onclick="likePost('${id}', ${item.likes || 0})">♥ ${item.likes || 0}</button>
              </div>
            </div>
          `;
        });
      });
    }

    // 3. Add New Post to Firestore
    function submitPost() {
      if (!currentUser) {
        alert('Please Sign In first to post content!');
        openAuthModal();
        return;
      }

      const title = document.getElementById('postTitle').value;
      const type = document.getElementById('postType').value;
      const url = document.getElementById('postUrl').value;

      if (!title || !url) {
        alert('Please fill out all fields');
        return;
      }

      db.collection("posts").add({
        title: title,
        type: type,
        url: url,
        author: currentUser.username,
        likes: 0,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        closeUploadModal();
        document.getElementById('postTitle').value = '';
        document.getElementById('postUrl').value = '';
      }).catch(err => {
        alert("Error posting: " + err.message);
      });
    }

    // 4. Like Post Function
    function likePost(id, currentLikes) {
      db.collection("posts").doc(id).update({
        likes: currentLikes + 1
      });
    }

    // Auth & UI Helpers
    function parseJwt(token) {
      var base64Url = token.split('.')[1];
      var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }

    function handleCredentialResponse(response) {
      const payload = parseJwt(response.credential);
      currentUser = {
        username: payload.name,
        email: payload.email,
        picture: payload.picture
      };
      localStorage.setItem('xmod_logged_user', JSON.stringify(currentUser));
      checkLoginState();
      closeAuthModal();
    }

    function checkLoginState() {
      const authArea = document.getElementById('authArea');
      if (currentUser) {
        authArea.innerHTML = `<img class="user-avatar" src="${currentUser.picture}" title="${currentUser.username}">`;
      } else {
        authArea.innerHTML = `<button class="btn-auth" onclick="openAuthModal()">Sign In</button>`;
      }
    }

    function openAuthModal() { document.getElementById('authModal').style.display = 'flex'; }
    function closeAuthModal() { document.getElementById('authModal').style.display = 'none'; }
    function openUploadModal() { document.getElementById('uploadModal').style.display = 'flex'; }
    function closeUploadModal() { document.getElementById('uploadModal').style.display = 'none'; }
  </script>
</body>
</html>
