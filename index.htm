<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X MOD - Video Sharing Platform</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0b0b; color: #fff; }

        @keyframes glow {
            0% { text-shadow: 0 0 5px #ff9900, 0 0 10px #ff9900; }
            50% { text-shadow: 0 0 20px #ff6600, 0 0 30px #ff6600; }
            100% { text-shadow: 0 0 5px #ff9900, 0 0 10px #ff9900; }
        }

        header { background: #121212; display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; border-bottom: 2px solid #ff9900; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 28px; font-weight: 900; letter-spacing: 1px; color: #fff; cursor: pointer; }
        .logo span { background: #ff9900; color: #000; padding: 2px 8px; border-radius: 4px; animation: glow 2s infinite; margin-left: 5px; }

        .container { padding: 30px; max-width: 1400px; margin: auto; }
        .page { display: none; }
        .active-page { display: block; }

        .upload-progress-container {
            display: none;
            background: #181818;
            border: 1px solid #ff9900;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
        }
        .upload-status-text { display: flex; justify-content: space-between; font-size: 14px; font-weight: bold; margin-bottom: 8px; color: #ff9900; }
        .progress-bar-bg { width: 100%; height: 10px; background: #333; border-radius: 5px; overflow: hidden; }
        .progress-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #ff9900, #ff5500); transition: width 0.2s; }

        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .video-card { background: #181818; border-radius: 8px; overflow: hidden; transition: transform 0.3s; cursor: pointer; border: 1px solid #222; }
        .video-card:hover { transform: translateY(-5px); border-color: #ff9900; }
        .thumbnail-container { width: 100%; height: 170px; background: #000; position: relative; }
        .thumbnail-container video { width: 100%; height: 100%; object-fit: cover; }
        .video-info { padding: 12px; }
        .video-title { font-size: 15px; font-weight: bold; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .video-meta { font-size: 12px; color: #aaa; }

        .fab-btn { position: fixed; bottom: 30px; right: 30px; background: linear-gradient(45deg, #ff9900, #ff5500); color: #fff; width: 65px; height: 65px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 36px; cursor: pointer; z-index: 99; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #1f1f1f; padding: 30px; border-radius: 10px; width: 90%; max-width: 500px; border: 1px solid #ff9900; position: relative; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; color: #aaa; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; }
        .form-group input { width: 100%; padding: 10px; background: #2b2b2b; border: 1px solid #444; color: white; border-radius: 4px; }
        .submit-btn { width: 100%; padding: 12px; background: #ff9900; border: none; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 4px; }

        .watch-container { max-width: 1000px; margin: auto; }
        .main-player { width: 100%; height: 500px; background: #000; border-radius: 8px; border: 1px solid #333; }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="showPage('homePage')">X<span>MOD</span></div>
    </header>

    <div id="homePage" class="container page active-page">
        <div id="uploadProgressContainer" class="upload-progress-container">
            <div class="upload-status-text">
                <span id="uploadTitleText">Uploading Video...</span>
                <span id="uploadPercentText">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div id="progressBarFill" class="progress-bar-fill"></div>
            </div>
        </div>

        <h2 style="margin-bottom: 20px; border-left: 4px solid #ff9900; padding-left: 10px;">Community Videos</h2>
        <div class="video-grid" id="videoGrid"></div>
    </div>

    <div id="watchPage" class="container page">
        <div class="watch-container">
            <button onclick="showPage('homePage')" style="background:none; border:none; color:#ff9900; cursor:pointer; margin-bottom:15px; font-size:16px;">← Back to Home</button>
            <video id="videoPlayer" class="main-player" controls autoplay></video>
            <h1 id="watchTitle" style="margin-top: 15px; font-size: 22px;"></h1>
        </div>
    </div>

    <div class="fab-btn" onclick="openModal()">+</div>

    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 style="color:#ff9900; margin-bottom:15px;">Public Video Upload</h2>
            <div class="form-group">
                <label>Video Title</label>
                <input type="text" id="videoTitleInput" placeholder="Enter video title...">
            </div>
            <div class="form-group">
                <label>Select Video File</label>
                <input type="file" id="videoFileInput" accept="video/*">
            </div>
            <button class="submit-btn" onclick="uploadVideoToCloud()">Upload & Share</button>
        </div>
    </div>

    <script>
        const CLOUD_NAME = "Iujkktcz"; 
        const UPLOAD_PRESET = "ml_default"; 

        function fetchGlobalVideos() {
            fetch(`https://res.cloudinary.com/${CLOUD_NAME}/video/list/public_video.json`)
                .then(res => res.json())
                .then(data => {
                    renderGrid(data.resources || []);
                })
                .catch(() => {
                    const localVideos = JSON.parse(localStorage.getItem('cloud_videos')) || [];
                    renderGrid(localVideos);
                });
        }

        function renderGrid(videoList) {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '';

            if (videoList.length === 0) {
                grid.innerHTML = '<p style="color: #666;">තවම වීඩියෝ නොමැත, පළමු වීඩියෝ එක + ඔබා Upload කරන්න!</p>';
                return;
            }

            videoList.forEach(v => {
                const videoUrl = v.public_id ? `https://res.cloudinary.com/${CLOUD_NAME}/video/upload/${v.public_id}.mp4` : v.url;
                const title = v.title || v.public_id || "Uploaded Video";

                const card = document.createElement('div');
                card.className = 'video-card';
                card.onclick = () => openWatchPage(videoUrl, title);
                card.innerHTML = `
                    <div class="thumbnail-container">
                        <video src="${videoUrl}#t=0.5" preload="metadata"></video>
                    </div>
                    <div class="video-info">
                        <div class="video-title">${title}</div>
                        <div class="video-meta">Shared Video</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openWatchPage(url, title) {
            document.getElementById('videoPlayer').src = url;
            document.getElementById('watchTitle').innerText = title;
            showPage('watchPage');
        }

        function uploadVideoToCloud() {
            const titleInput = document.getElementById('videoTitleInput').value.trim();
            const fileInput = document.getElementById('videoFileInput').files[0];

            if (!titleInput || !fileInput) {
                alert('කරුණාකර මාතෘකාවක් සහ Video එකක් Select කරන්න!');
                return;
            }

            closeModal();
            showPage('homePage');

            const progressContainer = document.getElementById('uploadProgressContainer');
            const progressFill = document.getElementById('progressBarFill');
            const percentText = document.getElementById('uploadPercentText');

            progressContainer.style.display = 'block';

            const formData = new FormData();
            formData.append('file', fileInput);
            formData.append('upload_preset', UPLOAD_PRESET);
            formData.append('tags', 'public_video'); 

            const xhr = new XMLHttpRequest();
            xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`, true);

            xhr.upload.onprogress = function(e) {
                if (e.lengthComputable) {
                    const percentComplete = Math.round((e.loaded / e.total) * 100);
                    progressFill.style.width = percentComplete + '%';
                    percentText.innerText = percentComplete + '%';
                }
            };

            xhr.onload = function() {
                if (xhr.status === 200) {
                    const response = JSON.parse(xhr.responseText);
                    
                    let localVideos = JSON.parse(localStorage.getItem('cloud_videos')) || [];
                    localVideos.unshift({ url: response.secure_url, title: titleInput });
                    localStorage.setItem('cloud_videos', JSON.stringify(localVideos));

                    progressContainer.style.display = 'none';
                    document.getElementById('videoTitleInput').value = '';
                    document.getElementById('videoFileInput').value = '';
                    alert('වීඩියෝ එක සාර්ථකව Upload වුණා!');
                    fetchGlobalVideos();
                } else {
                    alert('Upload කරගැනීමට නොහැකි විය. කරුණාකර නැවත උත්සාහ කරන්න.');
                    progressContainer.style.display = 'none';
                }
            };

            xhr.send(formData);
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById(pageId).classList.add('active-page');
            window.scrollTo(0, 0);
        }

        function openModal() { document.getElementById('uploadModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('uploadModal').style.display = 'none'; }

        fetchGlobalVideos();
    </script>
</body>
</html>
