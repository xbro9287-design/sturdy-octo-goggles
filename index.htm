<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xmod - Video Platform</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0d0d0d; color: #fff; }

        /* Header & Animated Logo */
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background-color: #141414; border-bottom: 2px solid #222; }
        
        .animated-logo {
            font-size: 36px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #ff0055, #ff5000, #ff0055);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite, pulse 1.5s ease-in-out infinite alternate;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }
        @keyframes pulse {
            from { transform: scale(1); filter: drop-shadow(0 0 2px #ff0055); }
            to { transform: scale(1.05); filter: drop-shadow(0 0 10px #ff0055); }
        }

        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }

        /* Upload Section */
        .upload-section { background-color: #1a1a1a; padding: 25px; border-radius: 10px; border: 1px solid #333; margin-bottom: 40px; }
        .upload-section h3 { margin-bottom: 15px; color: #ff0055; }
        .form-group { margin-bottom: 15px; }
        input[type="text"], input[type="file"] { width: 100%; padding: 12px; border-radius: 5px; border: 1px solid #444; background-color: #262626; color: #fff; }
        .btn-upload { background: linear-gradient(45deg, #ff0055, #ff5000); color: white; padding: 12px 25px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-upload:hover { opacity: 0.9; transform: translateY(-2px); }

        /* Video Feed Grid */
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .video-card { background-color: #1a1a1a; border-radius: 8px; overflow: hidden; border: 1px solid #2a2a2a; }
        .video-card video { width: 100%; height: 200px; object-fit: cover; background-color: #000; }
        .video-info { padding: 15px; }
        .video-title { font-size: 16px; font-weight: bold; margin-bottom: 5px; }
    </style>
</head>
<body>

    <header>
        <!-- Animation සහිත Xmod Logo එක -->
        <div class="animated-logo">Xmod</div>
        <div>
            <span>Online: <strong id="onlineCount" style="color: #00ffcc;">1</strong></span>
        </div>
    </header>

    <div class="container">
        <!-- ඕනෑම කෙනෙකුට Video Upload කිරීමට ඇති කොටස -->
        <div class="upload-section">
            <h3>Upload New Video</h3>
            <form id="uploadForm">
                <div class="form-group">
                    <input type="text" id="videoTitle" placeholder="වීඩියෝ එකේ මාතෘකාව (Title)" required>
                </div>
                <div class="form-group">
                    <input type="file" id="videoFile" accept="video/*" required>
                </div>
                <button type="submit" class="btn-upload">Upload Video</button>
            </form>
        </div>

        <!-- Upload කළ වීඩියෝ පෙන්වන ස්ථානය -->
        <h3 style="margin-bottom: 20px;">Uploaded Videos</h3>
        <div class="video-grid" id="videoGrid">
            <!-- උදාහරණ වීඩියෝ කාඩ්පතක් -->
        </div>
    </div>

    <script>
        const uploadForm = document.getElementById('uploadForm');
        const videoGrid = document.getElementById('videoGrid');

        // පරිශීලකයා Upload කරන වීඩියෝ එක Page එකේ පෙන්වීම (Browser preview)
        uploadForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const title = document.getElementById('videoTitle').value;
            const fileInput = document.getElementById('videoFile');
            const file = fileInput.files[0];

            if (file) {
                const videoUrl = URL.createObjectURL(file);
                
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <video controls src="${videoUrl}"></video>
                    <div class="video-info">
                        <div class="video-title">${title}</div>
                    </div>
                `;
                
                videoGrid.prepend(card);
                uploadForm.reset();
            }
        });
    </script>
</body>
</html>
